databases:
  - name: kabun-db
    databaseName: kabundb
    user: kabun
    plan: free
    region: oregon

services:
  - type: web
    name: kabun-coffee
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kabun-db
          property: connectionString
      - key: UPLOAD_DIR
        value: ./uploads
      - key: KEEP_ALIVE_URL
        value: https://kabun-coffee.onrender.com
