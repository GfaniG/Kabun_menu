databases:
  - name: kabun-db
    databaseName: kabundb
    user: kabun
    plan: free

services:
  - type: web
    name: kabun-coffee
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kabun-db
          property: connectionString
      - key: UPLOAD_DIR
        value: ./uploads
      - key: KEEP_ALIVE_URL
        value: https://kabun-coffee.onrender.com
